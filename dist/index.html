
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>photo-cut</title>
    <link rel="icon" href="./assets/favicon-BeTHDePQ.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon-b3AK_nSS.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon-DhiWjqcO.png" />
    <script>
      // 首屏前应用主题，避免闪烁
      (function () {
        try {
          var mode = localStorage.getItem("photo-cut-ui-theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var resolved = dark ? "dark" : "light";
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.classList.add("light");
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-BkRIgAxJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-dH3smvTJ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
