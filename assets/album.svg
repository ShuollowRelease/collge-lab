<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="相册">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F5F2"/>
      <stop offset="100%" stop-color="#EDE8F5"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F0EC"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFEAE4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A2438" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2A2438" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 装饰几何 -->
  <circle cx="86" cy="92" r="28" fill="#7C5CFF" opacity="0.18"/>
  <circle cx="720" cy="118" r="18" fill="#FF6B6B" opacity="0.35"/>
  <circle cx="700" cy="480" r="36" fill="#2EC4B6" opacity="0.22"/>
  <rect x="64" y="430" width="48" height="48" rx="14" fill="#FFD166" opacity="0.55"/>
  <rect x="668" y="250" width="22" height="22" rx="7" fill="#FF8FAB" opacity="0.55"/>

  <!-- 相册主体 -->
  <g filter="url(#soft)">
    <!-- 封面/书脊侧影 -->
    <rect x="188" y="168" width="424" height="268" rx="22" fill="#2A2438"/>
    <!-- 左页 -->
    <path d="M210 186h180c8 0 14 6 14 14v210c0 8-6 14-14 14H210c-12 0-22-10-22-22V208c0-12 10-22 22-22z" fill="url(#pageL)"/>
    <!-- 右页 -->
    <path d="M410 186h180c12 0 22 10 22 22v202c0 12-10 22-22 22H410c-8 0-14-6-14-14V200c0-8 6-14 14-14z" fill="url(#pageR)"/>
    <!-- 中缝 -->
    <rect x="396" y="186" width="10" height="248" rx="3" fill="#D9D2C8"/>
  </g>

  <!-- 左页照片 -->
  <g filter="url(#cardShadow)">
    <g transform="rotate(-6 280 300)">
      <rect x="236" y="236" width="118" height="140" rx="10" fill="#FFFFFF"/>
      <rect x="248" y="248" width="94" height="90" rx="6" fill="#7C5CFF"/>
      <!-- 简化风景 -->
      <circle cx="310" cy="272" r="12" fill="#FFD166"/>
      <path d="M248 320c18-22 30-22 48 0 12-14 22-14 34 0v18H248z" fill="#2EC4B6"/>
      <rect x="248" y="348" width="70" height="8" rx="4" fill="#E8E2DA"/>
      <rect x="248" y="362" width="48" height="8" rx="4" fill="#E8E2DA"/>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <g transform="rotate(8 340 330)">
      <rect x="300" y="278" width="108" height="128" rx="10" fill="#FFFFFF"/>
      <rect x="312" y="290" width="84" height="78" rx="6" fill="#FF6B6B"/>
      <circle cx="354" cy="318" r="16" fill="#FFF4E6" opacity="0.9"/>
      <path d="M312 352c14-16 28-16 42 0 10-12 20-12 30 0v16h-72z" fill="#FFB4A2"/>
      <rect x="312" y="376" width="58" height="7" rx="3.5" fill="#E8E2DA"/>
    </g>
  </g>

  <!-- 右页照片 -->
  <g filter="url(#cardShadow)">
    <g transform="rotate(5 520 280)">
      <rect x="470" y="218" width="130" height="150" rx="10" fill="#FFFFFF"/>
      <rect x="482" y="230" width="106" height="98" rx="6" fill="#2EC4B6"/>
      <circle cx="520" cy="262" r="14" fill="#FFFFFF" opacity="0.85"/>
      <path d="M482 310c22-24 38-24 60 0 14-16 28-16 44 0v18H482z" fill="#1B9AAA"/>
      <rect x="482" y="340" width="78" height="8" rx="4" fill="#E8E2DA"/>
      <rect x="482" y="354" width="54" height="8" rx="4" fill="#E8E2DA"/>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <g transform="rotate(-9 560 360)">
      <rect x="512" y="310" width="112" height="128" rx="10" fill="#FFFFFF"/>
      <rect x="524" y="322" width="88" height="78" rx="6" fill="#FFD166"/>
      <circle cx="568" cy="348" r="13" fill="#FF8FAB"/>
      <path d="M524 382c16-18 30-18 46 0 12-12 24-12 36 0v18h-82z" fill="#FFB703"/>
      <rect x="524" y="410" width="62" height="7" rx="3.5" fill="#E8E2DA"/>
    </g>
  </g>

  <!-- 亮色高光条 -->
  <rect x="248" y="214" width="56" height="6" rx="3" fill="#7C5CFF" opacity="0.55"/>
  <rect x="482" y="198" width="72" height="6" rx="3" fill="#FF6B6B" opacity="0.55"/>

  <!-- 前景漂浮小卡 -->
  <g filter="url(#cardShadow)">
    <g transform="rotate(12 150 360)">
      <rect x="118" y="320" width="86" height="100" rx="10" fill="#FFFFFF"/>
      <rect x="130" y="332" width="62" height="58" rx="5" fill="#FF8FAB"/>
      <circle cx="161" cy="354" r="9" fill="#FFFFFF" opacity="0.8"/>
      <rect x="130" y="400" width="42" height="6" rx="3" fill="#E8E2DA"/>
    </g>
  </g>

  <!-- 顶部标签 -->
  <g>
    <rect x="318" y="86" width="164" height="42" rx="21" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <circle cx="348" cy="107" r="8" fill="#7C5CFF"/>
    <rect x="368" y="100" width="88" height="6" rx="3" fill="#2A2438" opacity="0.75"/>
    <rect x="368" y="112" width="56" height="5" rx="2.5" fill="#2A2438" opacity="0.28"/>
  </g>

  <!-- 底部进度点 -->
  <circle cx="372" cy="512" r="5" fill="#7C5CFF"/>
  <circle cx="392" cy="512" r="5" fill="#2A2438" opacity="0.18"/>
  <circle cx="412" cy="512" r="5" fill="#2A2438" opacity="0.18"/>
  <circle cx="432" cy="512" r="5" fill="#2A2438" opacity="0.18"/>
</svg>
