<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram 发帖风格卡片</title>
    <link rel="stylesheet" href="./ins.css" />
  </head>
  <body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

    <div class="page">
      <header class="page-head">
        <div>
          <h1>Instagram 发帖风格</h1>
          <p>
            圆角卡片 · 自适应媒体区 · 内联 SVG 图标 · hover 轻微反馈 ·
            双击点赞。与播放器同一套图标/无障碍约定。
          </p>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle">
          切换深色主题
        </button>
      </header>

      <!--
        对外结构约定（可替换内部实现）：
        .ins-card > header + .ins-media + .ins-actions + .ins-body
        状态：liked / saved / likeCount；事件：like / save / comment / share
      -->
      <article class="ins-card" id="insCard" aria-label="Instagram 帖子">
        <header class="ins-header">
          <div class="ins-avatar-fallback" aria-hidden="true"></div>
          <div class="ins-user">
            <div class="ins-username">photo.cut</div>
            <div class="ins-meta">原始音频 · 推荐</div>
          </div>
          <button type="button" class="ins-btn" data-ins-more aria-label="更多选项">
            <!-- filled by JS -->
          </button>
        </header>

        <div class="ins-media" data-ins-media role="img" aria-label="帖子图片">
          <div class="ins-media-empty">4:5 / 1:1 媒体区</div>
          <div class="ins-heart-pop" data-ins-heart-pop aria-hidden="true"></div>
        </div>

        <div class="ins-actions">
          <button type="button" class="ins-btn" data-ins-like aria-label="赞" aria-pressed="false"></button>
          <button type="button" class="ins-btn" data-ins-comment aria-label="评论"></button>
          <button type="button" class="ins-btn" data-ins-share aria-label="分享"></button>
          <div class="ins-actions-right">
            <button type="button" class="ins-btn" data-ins-save aria-label="收藏" aria-pressed="false"></button>
          </div>
        </div>

        <div class="ins-body">
          <div class="ins-likes" data-ins-likes>赞</div>
          <p class="ins-caption">
            <span class="user">photo.cut</span>
            Through the Lens · 用同一套内联 SVG 规范做的发帖卡片
            <span class="tag">#photo-cut</span>
          </p>
          <button type="button" class="ins-more" data-ins-more-link>查看全部 12 条评论</button>
          <div class="ins-time">2 小时前</div>
        </div>
      </article>

      <section class="icon-notes" aria-label="图标说明">
        <h2>图标与功能对照</h2>
        <dl>
          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            赞
          </dt>
          <dd>空心 → 实心红；双击媒体区也可点赞（心心放大动画）</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            评论
          </dt>
          <dd>打开评论输入 / 列表</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"
                d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
            分享
          </dt>
          <dd>纸飞机，分享到私信或外链</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
                d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
            收藏
          </dt>
          <dd>右侧书签，选中后实心</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="5.5" r="1.35" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.35" fill="currentColor"/>
              <circle cx="12" cy="18.5" r="1.35" fill="currentColor"/>
            </svg>
            更多
          </dt>
          <dd>三点菜单</dd>
        </dl>
      </section>
    </div>

    <script type="module">
      import { mountInsPost, ICONS } from "./ins.js";

      const card = document.getElementById("insCard");
      const themeToggle = document.getElementById("themeToggle");

      // 预填图标
      card.querySelector("[data-ins-heart-pop]").innerHTML = ICONS.heartFill;
      card.querySelector("[data-ins-more]").innerHTML = ICONS.more;
      card.querySelector("[data-ins-comment]").innerHTML = ICONS.comment;
      card.querySelector("[data-ins-share]").innerHTML = ICONS.share;

      mountInsPost(card, {
        liked: false,
        saved: false,
        likeCount: 128,
        onEvent(type, detail) {
          // 业务侧只听这些事件，不改结构 API
          console.log("[ins]", type, detail);
        },
      });

      themeToggle.addEventListener("click", () => {
        const html = document.documentElement;
        const dark = html.classList.contains("ins-theme-dark");
        html.classList.toggle("ins-theme-dark", !dark);
        themeToggle.textContent = dark ? "切换深色主题" : "切换浅色主题";
      });
    </script>
  </body>
</html>
