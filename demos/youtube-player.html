<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube 长视频播放器</title>
    <link rel="stylesheet" href="./yt-player.css" />
  </head>
  <body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

    <div class="page">
      <header class="page-head">
        <div>
          <h1>YouTube 长视频播放器</h1>
          <p>
            16:9 画幅 · 底部渐变控制条 · 红进度（含缓冲）·
            播放/下一/音量/时间 · 字幕/设置/画中画/剧场/全屏。
            图标均为内联 SVG（viewBox 0 0 24 24）。
          </p>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle">
          切换浅色主题
        </button>
      </header>

      <!--
        对外结构约定：
        .yt-player > .yt-stage > video + hit + center + .yt-controls
        然后 .yt-meta 标题区。播放逻辑挂 <video>。
      -->
      <div class="yt-player is-paused" id="player" role="region" aria-label="视频播放器">
        <div class="yt-stage">
          <video class="yt-video" id="video" playsinline preload="metadata"></video>
          <button type="button" class="yt-hit" data-yt-hit aria-label="播放或暂停"></button>
          <button type="button" class="yt-center" data-yt-center aria-label="播放"></button>

          <div class="yt-controls">
            <div
              class="yt-progress"
              data-yt-progress
              role="slider"
              tabindex="0"
              aria-label="播放进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="yt-progress-track">
                <div class="yt-progress-buffer" data-yt-progress-buffer></div>
                <div class="yt-progress-fill" data-yt-progress-fill></div>
                <div class="yt-progress-thumb" data-yt-progress-thumb></div>
              </div>
            </div>

            <div class="yt-bar">
              <div class="yt-bar-left">
                <button type="button" class="yt-btn" data-yt-play aria-label="播放"></button>
                <button type="button" class="yt-btn" data-yt-next aria-label="下一个视频"></button>
                <div class="yt-volume-wrap">
                  <button type="button" class="yt-btn" data-yt-mute aria-label="静音"></button>
                  <div class="yt-volume-slider">
                    <input type="range" data-yt-volume min="0" max="100" value="80" aria-label="音量" />
                  </div>
                </div>
                <div class="yt-time">
                  <span data-yt-current>0:00</span>
                  <span class="sep">/</span>
                  <span data-yt-duration>0:00</span>
                </div>
              </div>

              <div class="yt-bar-right">
                <button type="button" class="yt-btn" data-yt-captions aria-label="字幕" aria-pressed="false"></button>
                <button type="button" class="yt-btn" data-yt-settings aria-label="设置"></button>
                <button type="button" class="yt-btn" data-yt-miniplayer aria-label="画中画"></button>
                <button type="button" class="yt-btn" data-yt-theater aria-label="剧场模式" aria-pressed="false"></button>
                <button type="button" class="yt-btn" data-yt-fullscreen aria-label="全屏" aria-pressed="false"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="yt-meta">
          <h2 class="yt-title">Midnight Drive — Official Visualizer</h2>
          <div class="yt-channel-row">
            <div class="yt-channel">
              <div class="yt-avatar" aria-hidden="true"></div>
              <div>
                <div class="yt-channel-name">photo-cut studio</div>
                <div class="yt-channel-subs">12.8万位订阅者</div>
              </div>
            </div>
            <button type="button" class="yt-subscribe" data-yt-subscribe>订阅</button>
            <div class="yt-actions">
              <button type="button" class="yt-chip" data-yt-like aria-label="赞" aria-pressed="false"></button>
              <button type="button" class="yt-chip" data-yt-share aria-label="分享"></button>
            </div>
          </div>
        </div>
      </div>

      <section class="icon-notes" aria-label="图标说明">
        <h2>图标与功能对照</h2>
        <dl>
          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3c0-.9.98-1.45 1.74-.97l10.3 6.7a1.15 1.15 0 0 1 0 1.94l-10.3 6.7c-.76.49-1.74-.06-1.74-.97V5.3z"/></svg>
            播放 / 暂停
          </dt>
          <dd>底栏左一，与居中大钮同步</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.03 4.28A2 2 0 0 0 3 6v12a2 2 0 0 0 3.03 1.72l9.99-6a2 2 0 0 0 0-3.44l-9.99-6zM17.8 5H20v14h-2.2z"/></svg>
            下一个视频
          </dt>
          <dd>双三角 + 竖线</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 5 6 9H2v6h4l5 4V5z"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
            音量 / 静音
          </dt>
          <dd>hover 展开音量滑杆</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path stroke="currentColor" stroke-width="1.8" d="M7 12h3M14 12h3"/></svg>
            字幕
          </dt>
          <dd>CC 开关</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 5h5.2v2H7v3.2H5V5zm9 0H19v5.2h-2V7h-3V5zM5 13.8h2V17h3.2v2H5v-5.2zM13.8 17H17v-3.2h2V17h-5.2v2z"/></svg>
            全屏 / 退出全屏
          </dt>
          <dd>最右；剧场模式在左邻</dd>
        </dl>
      </section>
    </div>

    <script type="module">
      import { mountYouTubePlayer, ICONS, formatTime } from "./yt-player.js";

      const player = document.getElementById("player");
      const video = document.getElementById("video");
      const themeToggle = document.getElementById("themeToggle");

      player.querySelector("[data-yt-center]").innerHTML = ICONS.play;
      player.querySelector("[data-yt-mute]").innerHTML = ICONS.volume;

      const DEMO_DURATION = 45;
      Object.defineProperty(video, "duration", {
        configurable: true,
        get: () => DEMO_DURATION,
      });

      // 无外链片源时用 canvas 动态占位
      const canvas = document.createElement("canvas");
      canvas.width = 1280;
      canvas.height = 720;
      const ctx = canvas.getContext("2d");
      let raf = 0;
      const draw = (now) => {
        const t = now / 1000;
        const g = ctx.createLinearGradient(0, 0, 1280, 720);
        g.addColorStop(0, "#0f0f0f");
        g.addColorStop(0.5, "#3a0a0a");
        g.addColorStop(1, "#0f0f0f");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 1280, 720);
        ctx.fillStyle = "rgba(255,0,0,0.15)";
        ctx.beginPath();
        ctx.arc(640 + Math.cos(t) * 160, 360 + Math.sin(t * 1.2) * 90, 90, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f1f1f1";
        ctx.font = "600 40px system-ui, sans-serif";
        ctx.fillText("YouTube Long Player Demo", 48, 72);
        ctx.font = "400 22px system-ui, sans-serif";
        ctx.fillStyle = "#aaa";
        ctx.fillText(formatTime(video.currentTime) + "  ·  内联 SVG 控件", 48, 112);
        raf = requestAnimationFrame(draw);
      };
      raf = requestAnimationFrame(draw);
      video.srcObject = canvas.captureStream(30);
      video.volume = 0.8;

      mountYouTubePlayer(player, video, {
        onEvent(type) {
          if (type === "ended") {
            video.currentTime = 0;
            video.play().catch(() => {});
          }
        },
      });

      themeToggle.addEventListener("click", () => {
        document.documentElement.classList.toggle("yt-theme-light");
        themeToggle.textContent = document.documentElement.classList.contains("yt-theme-light")
          ? "切换深色主题"
          : "切换浅色主题";
      });

      player.addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea")) return;
        if (e.code === "Space") {
          e.preventDefault();
          video.paused ? video.play().catch(() => {}) : video.pause();
        } else if (e.key.toLowerCase() === "m") {
          video.muted = !video.muted;
        } else if (e.key.toLowerCase() === "f") {
          document.fullscreenElement ? document.exitFullscreen() : player.requestFullscreen?.();
        } else if (e.key.toLowerCase() === "t") {
          player.classList.toggle("is-theater");
        }
      });

      window.addEventListener("beforeunload", () => cancelAnimationFrame(raf));
    </script>
  </body>
</html>
