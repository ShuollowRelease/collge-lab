<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN" class="player-theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter / X 风格视频播放器</title>
    <link rel="stylesheet" href="./player.css" />
  </head>
  <body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

    <div class="page">
      <header class="page-head">
        <div>
          <h1>Twitter / X 风格视频播放器</h1>
          <p>
            圆角卡片 · 自适应画幅 · 居中半透明播放钮 · 底部渐变控制栏 ·
            可拖动进度条。图标均为内联 SVG（viewBox 0 0 24 24），颜色由
            <code>--player-icon-color</code> 控制。
          </p>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle">
          切换浅色主题
        </button>
      </header>

      <!--
        对外结构约定（可原样替换内部实现）：
        .player > .player-stage > video + hit + center + .player-controls
        播放逻辑挂在 video 上，样式与图标可独立替换。
      -->
      <div class="player is-paused" id="player" tabindex="0" role="region" aria-label="视频播放器">
        <div class="player-stage">
          <!-- 演示片源：纯色动态占位；替换为真实 <video src="..."> 即可 -->
          <video
            class="player-video"
            id="video"
            playsinline
            preload="metadata"
            poster=""
          ></video>

          <button
            type="button"
            class="player-hit"
            data-player-hit
            aria-label="播放或暂停"
          ></button>

          <button
            type="button"
            class="player-center"
            data-player-center
            aria-label="播放"
          ></button>

          <div class="player-controls">
            <!-- 进度条：已播放高亮 + 可拖动滑块 -->
            <div
              class="player-progress"
              data-player-progress
              role="slider"
              tabindex="0"
              aria-label="播放进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="player-progress-track">
                <div class="player-progress-fill" data-player-progress-fill></div>
                <div class="player-progress-thumb" data-player-progress-thumb></div>
              </div>
            </div>

            <div class="player-bar">
              <div class="player-bar-left">
                <button
                  type="button"
                  class="player-btn"
                  data-player-toggle
                  aria-label="播放"
                ></button>

                <div class="player-volume-wrap">
                  <button
                    type="button"
                    class="player-btn"
                    data-player-mute
                    aria-label="静音"
                    aria-pressed="false"
                  ></button>
                  <div class="player-volume-slider">
                    <input
                      type="range"
                      data-player-volume
                      min="0"
                      max="100"
                      value="80"
                      aria-label="音量"
                    />
                  </div>
                </div>

                <div class="player-time" aria-live="off">
                  <span data-player-current>0:00</span>
                  <span class="sep">/</span>
                  <span data-player-duration>0:00</span>
                </div>
              </div>

              <div class="player-bar-right">
                <button
                  type="button"
                  class="player-btn"
                  data-player-fullscreen
                  aria-label="全屏"
                  aria-pressed="false"
                ></button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <section class="icon-notes" aria-label="图标说明">
        <h2>图标与功能对照</h2>
        <dl>
          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M8.2 5.3c0-.9.98-1.45 1.74-.97l10.3 6.7a1.15 1.15 0 0 1 0 1.94l-10.3 6.7c-.76.49-1.74-.06-1.74-.97V5.3z"/>
            </svg>
            播放
          </dt>
          <dd>居中圆钮 / 底栏左侧，开始播放视频</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M7 5.5h3.2v13H7v-13zm6.8 0H17v13h-3.2v-13z"/>
            </svg>
            暂停
          </dt>
          <dd>播放中与播放图标切换，暂停当前视频</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4v-5z"/>
              <path fill="currentColor" d="M14.8 8.2a4.8 4.8 0 0 1 0 7.6l-1.1-1.3a3.2 3.2 0 0 0 0-5l1.1-1.3z"/>
            </svg>
            音量
          </dt>
          <dd>展开音量滑杆；点击可静音</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4v-5z"/>
              <path fill="currentColor" d="M15.2 9.05 13.05 11.2 15.2 13.35l1.05-1.05L15.2 11.2l1.05-1.1-1.05-1.05zm3.5 0-1.05 1.05 1.05 1.1-1.05 1.05 1.05 1.05 2.15-2.15-2.15-2.15z"/>
            </svg>
            静音
          </dt>
          <dd>喇叭打叉状态，与音量按钮同一控件切换</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M5 5h5.2v2H7v3.2H5V5zm9 0H19v5.2h-2V7h-3V5zM5 13.8h2V17h3.2v2H5v-5.2zM13.8 17H17v-3.2h2V17h-5.2v2z"/>
            </svg>
            全屏
          </dt>
          <dd>进入全屏播放</dd>

          <dt>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M9.2 5v2.2H7.4l3.2 3.2-1.55 1.55-3.2-3.2v1.85H5V5h4.2zm5.6 14v-2.2h1.8l-3.2-3.2 1.55-1.55 3.2 3.2v-1.85H19V19h-4.2z"/>
            </svg>
            退出全屏
          </dt>
          <dd>全屏状态下与全屏按钮切换</dd>
        </dl>
      </section>
    </div>

    <script type="module" src="./player.js"></script>
    <script type="module">
      import { mountPlayer, formatTime } from "./player.js";

      const player = document.getElementById("player");
      const video = document.getElementById("video");
      const themeToggle = document.getElementById("themeToggle");

      // 演示：无外链媒体时用 canvas 生成轻量占位画面（可删）
      const makeDemoSource = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 1280;
        canvas.height = 720;
        const ctx = canvas.getContext("2d");
        let raf = 0;
        let t0 = performance.now();
        const draw = (now) => {
          const t = (now - t0) / 1000;
          const g = ctx.createLinearGradient(0, 0, 1280, 720);
          g.addColorStop(0, "#0f1419");
          g.addColorStop(0.5, "#1d9bf0");
          g.addColorStop(1, "#0f1419");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, 1280, 720);
          ctx.fillStyle = "rgba(255,255,255,0.12)";
          const r = 80 + Math.sin(t * 1.4) * 28;
          ctx.beginPath();
          ctx.arc(640 + Math.cos(t * 0.8) * 180, 360 + Math.sin(t * 1.1) * 100, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.88)";
          ctx.font = "600 42px system-ui, sans-serif";
          ctx.fillText("X-style Player Demo", 48, 72);
          ctx.font = "400 22px system-ui, sans-serif";
          ctx.fillStyle = "rgba(255,255,255,0.72)";
          ctx.fillText(formatTime(video.currentTime) + "  ·  内联 SVG 控件", 48, 112);
          raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);

        const stream = canvas.captureStream(30);
        return { stream, stop: () => cancelAnimationFrame(raf) };
      };

      // 若项目里已有真实视频地址，改成：
      // video.src = "your-video.mp4";
      const demo = makeDemoSource();
      video.srcObject = demo.stream;
      video.muted = false;
      video.volume = 0.8;

      // 流媒体没有固定 duration：用可控假时长演示进度条拖动
      const DEMO_DURATION = 30;
      Object.defineProperty(video, "duration", {
        configurable: true,
        get: () => DEMO_DURATION,
      });

      mountPlayer(player, video, {
        onEvent(type) {
          if (type === "ended") {
            video.currentTime = 0;
            video.play().catch(() => {});
          }
        },
      });

      themeToggle.addEventListener("click", () => {
        const html = document.documentElement;
        const dark = html.classList.contains("player-theme-dark");
        html.classList.toggle("player-theme-dark", !dark);
        html.classList.toggle("player-theme-light", dark);
        themeToggle.textContent = dark ? "切换深色主题" : "切换浅色主题";
      });

      // 键盘：空格播放/暂停，M 静音，F 全屏
      player.addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea")) return;
        if (e.code === "Space") {
          e.preventDefault();
          video.paused ? video.play().catch(() => {}) : video.pause();
        } else if (e.key.toLowerCase() === "m") {
          video.muted = !video.muted;
        } else if (e.key.toLowerCase() === "f") {
          document.fullscreenElement
            ? document.exitFullscreen()
            : player.requestFullscreen?.();
        }
      });

      window.addEventListener("beforeunload", () => demo.stop());
    </script>
  </body>
</html>
