<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="photo-cut">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F5F2"/>
      <stop offset="100%" stop-color="#EDE8F5"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F0EC"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFEAE4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2A2438" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#2A2438" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 圆角底板 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 装饰几何 -->
  <circle cx="72" cy="88" r="22" fill="#7C5CFF" opacity="0.20"/>
  <circle cx="448" cy="96" r="14" fill="#FF6B6B" opacity="0.38"/>
  <circle cx="436" cy="420" r="28" fill="#2EC4B6" opacity="0.24"/>
  <rect x="56" y="392" width="36" height="36" rx="11" fill="#FFD166" opacity="0.55"/>
  <rect x="420" y="220" width="18" height="18" rx="6" fill="#FF8FAB" opacity="0.6"/>

  <!-- 相册 -->
  <g filter="url(#soft)">
    <rect x="96" y="132" width="320" height="220" rx="20" fill="#2A2438"/>
    <path d="M114 148h132c7 0 12 5 12 12v176c0 7-5 12-12 12H114c-10 0-18-8-18-18V166c0-10 8-18 18-18z" fill="url(#pageL)"/>
    <path d="M266 148h132c10 0 18 8 18 18v160c0 10-8 18-18 18H266c-7 0-12-5-12-12V160c0-7 5-12 12-12z" fill="url(#pageR)"/>
    <rect x="250" y="148" width="12" height="220" rx="3" fill="#D9D2C8"/>
  </g>

  <!-- 左页照片 -->
  <g filter="url(#cardShadow)">
    <g transform="rotate(-5 170 230)">
      <rect x="132" y="176" width="96" height="112" rx="9" fill="#FFFFFF"/>
      <rect x="142" y="186" width="76" height="70" rx="5" fill="#7C5CFF"/>
      <circle cx="192" cy="206" r="10" fill="#FFD166"/>
      <path d="M142 242c14-18 24-18 38 0 10-12 18-12 28 0v14h-66z" fill="#2EC4B6"/>
      <rect x="142" y="266" width="56" height="7" rx="3.5" fill="#E8E2DA"/>
      <rect x="142" y="278" width="38" height="7" rx="3.5" fill="#E8E2DA"/>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <g transform="rotate(7 210 268)">
      <rect x="178" y="222" width="88" height="104" rx="9" fill="#FFFFFF"/>
      <rect x="188" y="232" width="68" height="62" rx="5" fill="#FF6B6B"/>
      <circle cx="222" cy="254" r="12" fill="#FFF4E6" opacity="0.92"/>
      <path d="M188 278c11-13 22-13 33 0 8-10 16-10 24 0v16h-57z" fill="#FFB4A2"/>
      <rect x="188" y="304" width="46" height="6" rx="3" fill="#E8E2DA"/>
    </g>
  </g>

  <!-- 右页照片 -->
  <g filter="url(#cardShadow)">
    <g transform="rotate(4 340 220)">
      <rect x="298" y="164" width="108" height="124" rx="9" fill="#FFFFFF"/>
      <rect x="308" y="174" width="88" height="80" rx="5" fill="#2EC4B6"/>
      <circle cx="338" cy="200" r="11" fill="#FFFFFF" opacity="0.88"/>
      <path d="M308 238c18-20 32-20 50 0 12-13 22-13 36 0v16h-86z" fill="#1B9AAA"/>
      <rect x="308" y="264" width="62" height="7" rx="3.5" fill="#E8E2DA"/>
      <rect x="308" y="276" width="42" height="7" rx="3.5" fill="#E8E2DA"/>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <g transform="rotate(-8 360 300)">
      <rect x="318" y="252" width="92" height="108" rx="9" fill="#FFFFFF"/>
      <rect x="328" y="262" width="72" height="64" rx="5" fill="#FFD166"/>
      <circle cx="364" cy="284" r="11" fill="#FF8FAB"/>
      <path d="M328 310c13-15 24-15 37 0 10-10 20-10 30 0v16h-67z" fill="#FFB703"/>
      <rect x="328" y="336" width="50" height="6" rx="3" fill="#E8E2DA"/>
    </g>
  </g>

  <!-- 亮色高光 -->
  <rect x="142" y="158" width="44" height="5" rx="2.5" fill="#7C5CFF" opacity="0.55"/>
  <rect x="308" y="152" width="58" height="5" rx="2.5" fill="#FF6B6B" opacity="0.55"/>

  <!-- 前景小卡 -->
  <g filter="url(#cardShadow)">
    <g transform="rotate(10 96 330)">
      <rect x="72" y="296" width="70" height="82" rx="9" fill="#FFFFFF"/>
      <rect x="82" y="306" width="50" height="46" rx="4" fill="#FF8FAB"/>
      <circle cx="107" cy="322" r="7" fill="#FFFFFF" opacity="0.82"/>
      <rect x="82" y="360" width="34" height="5" rx="2.5" fill="#E8E2DA"/>
    </g>
  </g>
</svg>
